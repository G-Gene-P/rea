name: 每日同步上游

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 同步上游默认分支
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::请在仓库 Actions secrets 中设置 UPSTREAM_SYNC_TOKEN"
            exit 1
          fi
          branch="$(gh api "repos/$REPO" --jq .default_branch)"
          gh api --method POST "repos/$REPO/merge-upstream" -f "branch=$branch"
